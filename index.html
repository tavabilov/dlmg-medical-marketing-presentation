<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1b1b1f"><title>DLMG · Медицинский маркетинг</title><link rel="stylesheet" href="style-v12.css"></head>
<body>
<a class="skip" href="#stage">К презентации</a>
<div class="app">
<header class="toolbar"><a href="#1" class="brand" aria-label="DLMG — первый слайд"><img src="assets/monogram-white.png" alt="DLMG"></a><div class="toolbar-actions"><button id="toc" aria-expanded="false" aria-controls="contents">Содержание</button><button id="motion-toggle" aria-pressed="false">Анимация: вкл.</button><a href="assets/DLMG.pdf" download>PDF</a><button id="fullscreen">Во весь экран</button></div></header>
<main id="stage" class="stage" tabindex="-1" aria-label="Презентация DLMG"></main>
<footer class="controls"><div class="slide-info"><span id="counter">01 / 27</span><span id="slide-name"></span></div><div class="nav"><button id="prev" aria-label="Предыдущий слайд">Назад</button><button id="play" aria-pressed="false">Автопоказ</button><button id="replay" aria-label="Повторить анимацию слайда">Повтор</button><button id="next" aria-label="Следующий слайд">Далее <span aria-hidden="true">→</span></button></div><div class="progress" aria-hidden="true"><i id="progress"></i></div></footer>
</div>
<aside id="contents" class="contents" hidden aria-label="Содержание презентации"><div class="contents-head"><h2>Содержание</h2><button id="close-toc">Закрыть</button></div><nav id="toc-list"></nav></aside>
<div id="announce" class="sr-only" aria-live="polite"></div>
<noscript><p class="no-js">Для анимации нужен JavaScript. <a href="assets/DLMG.pdf">Открыть полную презентацию в PDF</a></p></noscript>
<script src="presentation-v12.js" defer></script>
</body></html>
